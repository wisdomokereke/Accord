<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Accord | Ready to draft a contract?</title>

        <link rel="stylesheet" href="../../css/login.css">
        <link rel="icon" type="image/svg+xml"
            href="../../assets/images/favicon.svg">
    </head>

    <body>

        <main class="login-container">

            <!-- LEFT SIDE -->
            <section class="section-with-animation">

                <div class="section1">

                    <h1 id="logo" class="logo">
                        <a href="../../index.html">accord.</a>
                    </h1>

                    <div class="onboarding-info">

                        <div>

                            <div>
                                <p id="declare-login">Login</p>
                            </div>

                            <h1 id="declare-cta">
                                Continue from where you left off
                            </h1>

                            <p id="declare-description">
                                Join thousands of users who are already
                                transforming their workflows with Accord.
                            </p>

                        </div>

                    </div>

                </div>

            </section>

            <!-- RIGHT SIDE -->
            <section class="login-form">

                <h2>Login to your account</h2>

                <form id="login-form">

                    <div>
                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required>
                    </div>

                    <div>
                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>
                    </div>

                    <button
                        id="submit-btn"
                        type="submit">
                        Log in
                    </button>

                </form>

                <p>
                    Don't have an account?
                    <a href="signup.html">Sign up</a>
                </p>

            </section>

            <!-- LOADING SCREEN -->
            <section class="load-screen" id="load-screen">

                <div>
                    <h1 class="logo loading-logo">
                        accord.
                    </h1>
                </div>

            </section>

        </main>

        <!-- SUPABASE -->
        <script
            src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <!-- ACCORD CONFIG -->
        <script src="../../js/config.js"></script>
        <script src="../../js/supabase.js"></script>

        <!-- LOGIN LOGIC -->
        <script src="../../js/login.js"></script>

    </body>

</html>
